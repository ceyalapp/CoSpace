<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2F5D4E" />
  <title>CollabBuy — community knowledge for home decisions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot-dot"></div>
      <div class="boot-label">CollabBuy</div>
    </div>
  </div>

  <!-- Boot error handler, runtime Supabase config, then the locally-bundled app (esbuild). -->
  <!-- All scripts are same-origin so the CSP can use script-src 'self'. No CDN, no in-browser Babel. -->
  <script src="/boot.js"></script>
  <script src="/config.js"></script>
  <script src="/app.bundle.js" defer></script>
</body>
</html>
